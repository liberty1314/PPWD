olid #dcfce7;color:#15803d;border-radius:8px;font-size:11px;margin:14px 0}.mini{width:350px;height:230px;border:1px solid #e4e4e7;border-radius:18px;background:white;padding:22px;box-shadow:0 12px 30px #18181b14}.hidden{display:none!important}
+</style></head><body><div class="toolbar" id="tabs"><strong>BearPassword · 全页面原型</strong></div><div class="app" id="app"></div><script>
const pages=[['dashboard','概览'],['vault','密码库'],['favorites','收藏'],['recent','最近访问'],['settings-general','设置 · 通用'],['settings-security','设置 · 安全'],['settings-appearance','设置 · 外观'],['settings-shortcuts','设置 · 快捷键'],['setup','初始化保险库'],['unlock','解锁'],['recover','恢复保险库'],['bind','绑定账户'],['island','快速搜索浮窗']];
const icon=(s)=>`<div class="icon">${s}</div>`;function shell(active,content){return `<div class="title">BearPassword　　·　　本地保险库</div><div class="body"><aside class="side"><div class="brand"><i class="logo">B</i>BearPassword</div><div class="nav ${active==='dashboard'?'on':''}">▦　概览</div><div class="nav ${active==='vault'?'on':''}">▣　密码库 <span style="float:right">128</span></div><div class="nav ${active==='favorites'?'on':''}">☆　收藏</div><div class="nav ${active==='recent'?'on':''}">◷　最近访问</div><div class="nav">⚙　设置</div><div class="spacer"></div><div class="vault">🟢　本地保险库<br><br>　端到端加密已开启</div></aside><main class="main">${content}</main></div>`}
function vault(title,mode){let data=mode==='favorites'?[['GitHub','alexchen','⌘'],['Netflix','alex@example.com','N'],['Amazon','alex@example.com','a']]:mode==='recent'?[['Google','alex.chen@gmail.com','G'],['GitHub','alexchen','⌘'],['Notion','alex.chen@work.com','N']]:[['Google','alex.chen@gmail.com','G'],['GitHub','alexchen','⌘'],['Notion','alex.chen@work.com','N'],['Dropbox','alex.chen@gmail.com','D']];return shell(mode,`<div class="top"><div class="row between"><div><h1 class="h">${title}</h1><p class="muted">管理并快速访问你的账号与安全信息</p></div><button class="btn">＋ 新增条目</button></div><div class="row"><div class="field" style="width:320px;margin:0">⌕　搜索名称、用户名或网址…</div><div class="field" style="width:145px;margin:0">所有类型　⌄</div><span class="pill">${data.length} 条</span></div></div><div class="vaultlayout"><div class="listbox"><div class="entry muted">条目列表　　<span style="float:right">最近更新⌄</span></div>${data.map((x,i)=>`<div class="entry ${i===0?'sel':''}"><div class="row">${icon(x[2])}<div><b>${x[0]}</b><div class="muted" style="margin-top:5px">${x[1]}</div></div></div></div>`).join('')}</div><div class="panel"><div class="row">${icon(data[0][2])}<div><b style="font-size:17px">${data[0][0]}</b><div class="muted">accounts.google.com</div></div><button class="btn ghost" style="margin-left:auto">☆　收藏　　编辑</button></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><div class="safe">●　密码安全性良好</div><div class="twocol"><div><div class="fieldtitle">用户名</div><div class="field">${data[0][1]}</div></div><div><div class="fieldtitle">密码</div><div class="field">••••••••••••••••　　复制</div></div><div><div class="fieldtitle">登录网址</div><div class="field">https://accounts.google.com</div></div><div><div class="fieldtitle">备注</div><div class="field">个人主账号，已启用两步验证</div></div></div><div class="muted">最近使用　·　今天 14:32</div></div></div>`)}
function settings(section){return shell('',`<div class="top"><h1 class="h">设置</h1><p class="muted">管理安全、外观与系统偏好</p></div><div class="settinglayout"><div class="settingnav">${[['general','通用'],['security','安全与备份'],['appearance','外观与语言'],['shortcuts','快捷键']].map(x=>`<div class="nav ${x[0]===section?'on':''}">${x[1]}</div>`).join('')}</div><div class="settingbody"><h2 style="font-size:17px;margin:0 0 10px">${{general:'通用',security:'安全与备份',appearance:'外观与语言',shortcuts:'快捷键'}[section]}</h2>${(section==='general'?[['开机时启动','让 BearPassword 随系统启动'],['系统托盘','在菜单栏或系统托盘中显示'],['关闭窗口时隐藏','保留应用在后台运行']]:section==='security'?[['自动锁定','闲置 5 分钟后自动锁定'],['剪贴板清理','复制密码后 30 秒清除'],['生物识别解锁','使用设备生物识别快速解锁'],['保险库备份','管理加密备份与恢复']]:section==='appearance'?[['主题模式','浅色'],['界面字体','系统默认'],['语言','简体中文']]:[['快速搜索','⌘　K'],['显示/隐藏应用','⌥　⌘　B'],['锁定保险库','⌘　L']]).map((x,i)=>`<div class="settingrow"><div><b>${x[0]}</b><div class="muted" style="margin-top:6px">${x[1]}</div></div>${section==='general'||(section==='security'&&i<3)?'<i class="switch"></i>':'<span class="field" style="margin:0;min-width:125px">'+(x[1].includes('⌘')?x[1]:'浅色　⌄')+'</span>'}</div>`).join('')}</div></div>`)}
function auth(title,sub,placeholder,button,extra){return `<div class="auth"><div class="authcard"><div class="authlogo">B</div><h1>${title}</h1><p>${sub}</p>${extra||''}<div class="fieldtitle">${placeholder}</div><div class="field">${placeholder.includes('密码')?'●●●●●●●●●●●●':'请输入'}</div><button class="btn wide">${button}</button><p style="text-align:center;margin-top:18px">${title==='解锁保险库'?'忘记主密码？　使用恢复密钥':''}</p></div></div>`}
const render={dashboard:()=>shell('dashboard',`<div class="top"><h1 class="h">欢迎回来</h1><p class="muted">你的数字生活，由此安全管理。</p></div><div class="grid"><div class="card"><div class="label">总密码数</div><div class="num">128</div><div class="muted">条保险库记录</div></div><div class="card"><div class="label">收藏条目</div><div class="num">12</div><div class="muted">常用账号一键访问</div></div><div class="card"><div class="label">最近访问</div><div class="num">8</div><div class="muted">过去 7 天</div></div></div><div class="twocol"><div class="card"><b>最近访问</b>${[['Google','今天 14:32'],['GitHub','昨天 10:12'],['Notion','10月24日']].map(x=>`<div class="line">${icon(x[0][0])}<div><b>${x[0]}</b><div class="muted">${x[1]}</div></div></div>`).join('')}</div><div class="card"><b>安全状态</b><div class="safe" style="margin-top:18px">●　保险库保护正常</div><p class="muted">主密码已启用，自动锁定已开启。记得定期检查重要账户的密码。</p><button class="btn ghost">查看安全设置</button></div></div>`),vault:()=>vault('密码库','vault'),favorites:()=>vault('收藏','favorites'),recent:()=>vault('最近访问','recent'),'settings-general':()=>settings('general'),'settings-security':()=>settings('security'),'settings-appearance':()=>settings('appearance'),'settings-shortcuts':()=>settings('shortcuts'),setup:()=>auth('创建你的保险库','设置主密码以保护本地保存的账号信息。主密码无法找回，请妥善保管。','创建主密码','创建保险库','<div class="safe">✓　主密码仅在本机验证，不会上传</div>'),unlock:()=>auth('欢迎回来','输入主密码以解锁本地保险库。','主密码','解锁保险库','<div class="safe">●　保险库已加密锁定</div>'),recover:()=>auth('恢复保险库','使用此前保存的恢复密钥重建访问权限。','恢复密钥','验证并恢复','<div class="field">粘贴恢复密钥</div>'),bind:()=>auth('绑定账户','连接账户以启用同步和跨设备访问。','邮箱地址','继续','<div class="safe">账户绑定不会替代本地加密</div>'),island:()=>`<div class="auth"><div class="mini"><div class="row between"><b>快速搜索</b><span class="muted">⌘ K</span></div><div class="field" style="margin:16px 0">⌕　搜索密码、账号或网址…</div><div class="line">${icon('G')}<div><b>Google</b><div class="muted">alex.chen@gmail.com</div></div><button class="btn" style="margin-left:auto">复制</button></div><div class="line">${icon('⌘')}<div><b>GitHub</b><div class="muted">alexchen</div></div><button class="btn ghost" style="margin-left:auto">复制</button></div></div></div>`};
const tabbar=document.getElementById('tabs');pages.forEach(([id,name])=>{const b=document.createElement('button');b.className='tab';b.textContent=name;b.onclick=()=>show(id);b.id='tab-'+id;tabbar.appendChild(b)});function show(id){document.getElementById('app').innerHTML=render[id]();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='tab-'+id));history.replaceState(null,'','#'+id)}show(location.hash.slice(1)||'dashboard');
</script></body></html>
