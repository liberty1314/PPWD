function firstRun(){return stateShell('欢迎使用 PPWD','完成几个步骤，开始保护你的账号。',`<div class="wizard"><aside class="wizard-steps"><div class="wizard-step done"><i class="step-num">✓</i>创建本地保险库</div><div class="wizard-step active"><i class="step-num">2</i>保存恢复密钥</div><div class="wizard-step"><i class="step-num">3</i>添加第一条密码</div></aside><section class="wizard-card"><div class="state-title">保存你的恢复密钥</div><p class="state-desc">恢复密钥可在忘记主密码时恢复访问。它只显示一次，请离线保存，不要与主密码放在同一位置。</p><div class="field-value" style="height:54px;justify-content:center;font-family:monospace;letter-spacing:1px;margin-top:18px">BP-7KQ4 - 92NM - 3LTX - 8FWA</div><div class="row" style="margin-top:10px"><button class="button">复制密钥</button><button class="button">下载文本文件</button></div><div class="state-banner banner-warning">请确认已将恢复密钥保存在安全位置。丢失密钥和主密码后，保险库无法恢复。</div><label style="font-size:10px;color:var(--sub)"><input type="checkbox"> 我已安全保存恢复密钥</label><div class="row between" style="margin-top:20px"><span class="link">稍后提醒我</span><button class="button primary">继续添加密码　→</button></div></section></div>`,'')}
function batchPage(){return stateShell('密码库','批量管理选中的条目。',`<div class="state-panel"><div class="state-banner banner-info">已选择 3 条　　<button class="button">收藏</button>　<button class="button">移动</button>　<button class="button">删除</button>　<button class="button">取消选择</button></div><div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><input type="checkbox" checked>全选当前页</div>${[['Google','alex.chen@gmail.com','G'],['GitHub','alexchen','⌘'],['Notion','alex.chen@work.com','N']].map(x=>`<div class="entry"><input type="checkbox" checked>${icon(x[2])}<div class="entry-copy"><div class="entry-name">${x[0]}</div><div class="entry-user">${x[1]}</div></div><span class="entry-time">已选择</span></div>`).join('')}</div>`,'vault')}
function deleteConfirm(){return stateShell('删除条目','查看删除操作的影响。',`<div class="state-panel" style="max-width:560px;margin:30px auto"><div class="state-banner banner-warning">即将删除以下条目</div><div class="entry">${icon('G','f-google')}<div class="entry-copy"><div class="entry-name">Google</div><div class="entry-user">alex.chen@gmail.com</div></div></div><p class="state-desc" style="margin:14px 0">此操作会从当前保险库中永久移除该条目。删除后无法撤销。</p><div class="row" style="justify-content:flex-end"><button class="button">取消</button><button class="button" style="background:#be123c;color:#fff;border-color:#be123c">删除条目</button></div></div>`,'vault')}
function securityCenter(){return shell('dashboard',`<header class="pagehead"><div class="crumb">工作区　/　安全中心</div><h1 class="title">安全中心</h1><div class="subtitle">检查保险库中的密码风险，并逐项改善。</div></header><section class="state-page"><div class="state-panel"><div class="row between"><div><div class="state-title">密码健康概况</div><div class="state-desc">上次检查：今天 14:30</div></div><button class="button">重新检查</button></div><div class="health-grid"><div class="health-stat"><b style="color:#be123c">4</b><span>弱密码</span></div><div class="health-stat"><b style="color:#a16207">2</b><span>重复密码</span></div><div class="health-stat"><b>7</b><span>超过一年未更新</span></div></div><div class="section-label">建议优先处理</div>${[['弱密码','Twitter','密码强度较低 · 建议立即更新'],['重复密码','Amazon','与其他 1 个账号重复使用'],['长期未更新','论坛账号','上次更新：2024年 2月']].map(x=>`<div class="risk-row"><span class="risk-kind">${x[0]}</span><div class="risk-meta"><b>${x[1]}</b><small>${x[2]}</small></div><button class="button">查看条目　→</button></div>`).join('')}</div></section>`)}
function backupPage(){return shell('',`<header class="pagehead"><div class="crumb">偏好设置　/　安全与备份</div><h1 class="title">备份与恢复</h1><div class="subtitle">创建加密保险库备份，或从已有备份恢复。</div></header><section class="state-page"><div class="backup-layout"><div class="state-panel"><div class="row between"><div><div class="state-title">加密备份</div><div class="state-desc">备份文件只能使用主密码解密。</div></div><button class="button primary">创建备份</button></div><div class="backup-item"><span class="backup-icon">↓</span><div class="backup-meta"><b>PPWD-backup-2026-10-28.bpv</b><small>最近备份 · 2026年10月28日 · 2.4 MB</small></div><button class="button">导出</button></div><div class="backup-item"><span class="backup-icon">＋</span><div class="backup-meta"><b>从备份文件恢复</b><small>选择 .bpv 加密备份文件</small></div><button class="button">选择文件</button></div></div><div class="state-panel"><div class="state-title">恢复密钥</div><div class="state-desc">主密码不可用时用于恢复保险库访问。</div><div class="state-banner banner-warning">恢复密钥仅在本机生成。重新生成会立即使旧密钥失效。</div><button class="button">查看或重新生成密钥</button></div></div></section>`)}
function narrowPage(){const content=`<div class="narrow-frame"><div class="narrow-head"><span class="back">← 返回列表</span><strong style="font-size:11px">Google</strong><span class="push muted">⋯</span></div><div class="narrow-body"><aside class="narrow-list">${[['Google','alex.chen@gmail.com','G','f-google'],['GitHub','alexchen','⌘','f-git'],['Notion','alex.chen@work.com','N','f-note'],['Dropbox','alex.chen@gmail.com','D','f-drop']].map((x,i)=>`<div class="entry ${i===0?'selected':''}">${icon(x[2],x[3])}<div class="entry-copy"><div class="entry-name">${x[0]}</div><div class="entry-user">${x[1]}</div></div></div>`).join('')}</aside><main class="narrow-detail"><div class="row">${icon('G','f-google')}<div><div class="entry-name">Google</div><div class="entry-user">accounts.google.com</div></div><button class="button push">编辑</button></div><div class="security-note" style="margin-top:16px">●　密码安全性良好</div><div class="field-grid"><div><div class="field-label">用户名</div><div class="field-value">alex.chen@gmail.com</div></div><div><div class="field-label">密码</div><div class="field-value">•••••••••••••　▢</div></div><div><div class="field-label">登录网址</div><div class="field-value">accounts.google.com</div></div></div></main></div></div>`;return `<div class="titlebar"><span class="traffic"><i></i><i></i><i></i></span>窄窗口适配预览 · 900px</div>${content}`}
const render={dashboard,vault:()=>vaultPage('密码库','vault'),favorites:()=>vaultPage('收藏','favorites'),recent:()=>vaultPage('最近访问','recent'),'security-center':securityCenter,'create-type':createType,'create-login':createLogin,'first-run':firstRun,empty:emptyPage,'no-results':noResults,loading:loadingPage,error:errorPage,batch:batchPage,'delete-confirm':deleteConfirm,'settings-general':()=>settingsPage('general'),'settings-security':()=>settingsPage('security'),'settings-appearance':appearancePage,'settings-shortcuts':()=>settingsPage('shortcuts'),backup:backupPage,setup:()=>authPage('setup'),unlock:()=>authPage('unlock'),recover:()=>authPage('recover'),island,narrow:narrowPage}
const bar=document.getElementById('tabs'),picker=document.getElementById('scene-picker');pages.forEach(([id,label],index)=>{const b=document.createElement('button');b.className='tab';b.textContent=label;b.id='tab-'+id;b.onclick=()=>show(id);bar.appendChild(b);const option=document.createElement('option');option.value=id;option.textContent=`${String(index+1).padStart(2,'0')}　${label}`;picker.appendChild(option)});
function buildAppearanceOptions(){const grid=document.querySelector('.theme-grid');if(!grid)return;const heading=grid.parentElement.querySelector('.row');heading.querySelector('.setting-name').textContent='主题设计';heading.querySelector('.setting-desc').textContent='选择界面材质与层级；颜色单独设置';heading.querySelector(':scope > .setting-desc')?.remove();const count=document.createElement('span');count.className='setting-desc';count.textContent='4 款';heading.appendChild(count);grid.classList.add('theme-design-grid');grid.innerHTML='';const designs=[['classic','经典中性','清晰、克制的实色界面','classic'],['liquid','液态玻璃','通透材质与柔和边缘','liquid'],['soft','柔和层叠','轻柔表面与浅层阴影','soft'],['contrast','高对比','强化边界与文字辨识','contrast']];designs.forEach(([id,name,desc,visual],index)=>{const option=document.createElement('button');option.type='button';option.className=`theme-option design-option${index===0?' selected':''}`;option.dataset.theme=id;option.innerHTML=`<span class="design-preview ${visual}"><i></i><i></i></span><span class="design-copy"><b>${name}</b><small>${desc}</small></span>${index===0?'<b class="checkmark">✓</b>':''}`;grid.appendChild(option)});const note=document.createElement('div');note.className='theme-note';note.textContent='主题决定表面材质和层级。液态玻璃主要用于导航、工具栏和浮层，账号与密码内容保持清晰底色。';const accents=document.createElement('section');accents.className='accent-section';accents.innerHTML='<div class="accent-heading">强调色 <span>应用于选中态、焦点和主要操作 · 6 种</span></div><div class="accent-grid"></div>';const colors=[['蓝色','#4f77d1'],['青绿','#268c8a'],['绿色','#47845a'],['紫色','#7865b1'],['珊瑚','#d16c65'],['琥珀','#b47a2b']];colors.forEach(([name,color],index)=>{const button=document.createElement('button');button.type='button';button.className=`color-option${index===0?' selected':''}`;button.dataset.color=color;button.innerHTML=`<span class="color-dot" style="--tone:${color}"></span><span>${name}</span>`;accents.querySelector('.accent-grid').appendChild(button)});grid.after(note,accents)}
function bindAppearance(){const preview=document.getElementById('theme-preview');if(!preview)return;const previewWrap=preview.closest('.preview-wrap'),detail=previewWrap.querySelector('.appearance-preview-detail'),dot=document.getElementById('preview-dot');document.querySelectorAll('.theme-option').forEach(option=>{option.setAttribute('aria-pressed',String(option.classList.contains('selected')));option.addEventListener('click',()=>{document.querySelectorAll('.theme-option').forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-pressed','false');item.querySelector(':scope > .checkmark')?.remove()});option.classList.add('selected');option.setAttribute('aria-pressed','true');option.insertAdjacentHTML('beforeend','<b class="checkmark">✓</b>');preview.classList.remove('liquid','soft','contrast');if(option.dataset.theme!=='classic')preview.classList.add(option.dataset.theme)})});document.querySelectorAll('.color-option').forEach(option=>{option.setAttribute('aria-pressed',String(option.classList.contains('selected')));option.addEventListener('click',()=>{document.querySelectorAll('.color-option').forEach(item=>{item.classList.toggle('selected',item===option);item.setAttribute('aria-pressed',String(item===option))});const color=option.dataset.color;previewWrap.style.setProperty('--preview-accent',color);dot.style.background=color})});document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(item=>item.classList.toggle('active',item===button));const dark=button.dataset.mode==='dark';previewWrap.classList.toggle('dark',dark);preview.classList.toggle('dark',dark);detail.classList.toggle('dark',dark)}));document.querySelectorAll('[data-font]').forEach(button=>button.addEventListener('click',()=>document.querySelectorAll('[data-font]').forEach(item=>item.classList.toggle('active',item===button))));document.querySelectorAll('.preview-setting .select-card').forEach(button=>button.addEventListener('click',()=>{button.parentElement.querySelectorAll('.select-card').forEach(item=>item.classList.toggle('active',item===button))}));document.querySelectorAll('.preview-setting .switch').forEach(button=>button.addEventListener('click',()=>button.classList.toggle('on')))}
function show(id){if(!render[id])id='dashboard';document.getElementById('app').innerHTML=render[id]();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('is-active',x.id==='tab-'+id));picker.value=id;const index=pages.findIndex(item=>item[0]===id);document.getElementById('scene-count').textContent=`${index+1} / ${pages.length} 个场景`;document.getElementById('tab-'+id)?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});history.replaceState(null,'','#'+id);buildAppearanceOptions();bindAppearance()}
function moveScene(delta){const index=pages.findIndex(item=>item[0]===picker.value),next=(index+delta+pages.length)%pages.length;show(pages[next][0])}
document.getElementById('scene-prev').onclick=()=>moveScene(-1);document.getElementById('scene-next').onclick=()=>moveScene(1);picker.onchange=()=>show(picker.value);document.getElementById('rail-left').onclick=()=>bar.scrollBy({left:-260,behavior:'smooth'});document.getElementById('rail-right').onclick=()=>bar.scrollBy({left:260,behavior:'smooth'});bar.addEventListener('keydown',event=>{if(event.key==='ArrowRight')moveScene(1);if(event.key==='ArrowLeft')moveScene(-1)});show(location.hash.slice(1)||'dashboard')
</script>
</body>
